name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync                   # the workspace dev group installs both packages with every extra
      - run: uv run pytest -q -W error  # includes the exporter tests, which run the browser scripts' logic in node
      - run: uv build --all-packages    # each package must build on its own

  pii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the gate scans all of history, not just the tip
      - run: scripts/pii_check.sh
