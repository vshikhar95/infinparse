name: release
# Push a tag `<package>-v<version>` (e.g. indian-finance-parsers-v0.2.0) on a commit that's on main. The version comes
# from the tag (hatch-vcs). Build and test run without publishing rights; the publish job only uploads the built files.
on:
  push:
    tags: ["*-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.4"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.which.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: which
        name: package from tag, and the tag must be on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package="${TAG%-v*}"
          case "$package" in indian-finance-parsers|purchase-history-parsers) ;; *) echo "unknown package: $package"; exit 1 ;; esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run pytest -q -W error
      - name: build only this package, check its files and version
        env:
          PACKAGE: ${{ steps.which.outputs.package }}
          TAG: ${{ github.ref_name }}
        run: |
          uv build --package "$PACKAGE" -o dist
          python3 scripts/check_dist.py dist/*
          version="${TAG##*-v}"
          ls dist/*-"$version"-py3-none-any.whl > /dev/null || { echo "built version doesn't match tag $TAG"; ls dist; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi  # PyPI's trusted publisher names this repo, release.yml and this environment
    permissions:
      id-token: write  # Trusted Publishing: no stored token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: notes from merged PRs since this package's previous tag, through the PII gate, then the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PACKAGE: ${{ needs.build.outputs.package }}
        run: |
          previous=$(git tag --list "$PACKAGE-v*" --sort=-v:refname | grep -vx "$TAG" | head -1)
          args=(-f "tag_name=$TAG"); [ -n "$previous" ] && args+=(-f "previous_tag_name=$previous")
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > notes.md
          PII_TEXT="$(cat notes.md)" bash scripts/pii_check.sh
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md
