[project]
name = "indian-finance-parsers"
version = "0.1.0"
description = "Parse Indian bank, card, broker and fund statements into plain Python records."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11.10"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
excel = ["pandas>=2.2", "xlrd>=2.0.2", "openpyxl>=3.1.5"]
cas = ["casparser>=1.4.1"]
decrypt = ["pikepdf>=10.17.0", "msoffcrypto-tool>=6.0.0"]
all = ["indian-finance-parsers[excel,cas,decrypt]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
