[project]
name = "indian-finance-parsers"
dynamic = ["version"]  # from the git tag <package>-v<version>; see [tool.hatch.version]
description = "Parse Indian bank, card, broker and fund statements into plain Python records."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11.10", "beautifulsoup4>=4.12"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
excel = ["pandas>=2.2", "xlrd>=2.0.2", "openpyxl>=3.1.5"]
cas = ["casparser>=1.4.1"]
decrypt = ["pikepdf>=10.17.0", "msoffcrypto-tool>=6.0.0"]
all = ["indian-finance-parsers[excel,cas,decrypt]"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]  # setuptools-scm, scoped to this package's tags in the shared repo
root = "../.."
tag_regex = "^indian-finance-parsers-v(?P<version>\\d+\\.\\d+\\.\\d+.*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "indian-finance-parsers-v*"]
fallback_version = "0.0.0"  # a checkout without tags (e.g. a shallow clone)

[tool.hatch.build.targets.sdist]  # an explicit list: nothing else in the folder can ship to PyPI
only-include = ["src", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/indian_finance_parsers"]
