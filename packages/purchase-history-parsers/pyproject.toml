[project]
name = "purchase-history-parsers"
dynamic = ["version"]  # from the git tag <package>-v<version>; see [tool.hatch.version]
description = "Parse store purchase histories (Steam, Google Play, Humble Bundle, Amazon, PlayStation) into plain Python records."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]  # setuptools-scm, scoped to this package's tags in the shared repo
root = "../.."
tag_regex = "^purchase-history-parsers-v(?P<version>\\d+\\.\\d+\\.\\d+.*)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "purchase-history-parsers-v*"]
fallback_version = "0.0.0"  # a checkout without tags (e.g. a shallow clone)

[tool.hatch.build.targets.sdist]  # an explicit list: nothing else in the folder can ship to PyPI
only-include = ["src", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/purchase_history_parsers"]
