# infinparse: a uv workspace of independent parser packages (see packages/). Each package builds and releases on its
# own; this root only wires them together for development.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
indian-finance-parsers = { workspace = true }
purchase-history-parsers = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.1.1", "fpdf2>=2.8", "indian-finance-parsers[all]", "purchase-history-parsers"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/indian-finance-parsers/tests", "packages/purchase-history-parsers/tests"]
addopts = ["--import-mode=importlib"]  # the packages' test files share names (test_docs.py)

[tool.mypy]
files = ["packages/indian-finance-parsers/src", "packages/purchase-history-parsers/src"]
ignore_missing_imports = true  # CI runs mypy without installing the parsers' dependencies

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = ["B"]  # bugbear: likely bugs (mutable defaults, loop-variable capture, ...) on top of the defaults
